[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transferlab"
version = "0.2.0"
description = "Auditable CIFAR-10 adversarial transfer evaluation"
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4", "foolbox==3.3.4", "matplotlib==3.9.4"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["transferlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
